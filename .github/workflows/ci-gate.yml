name: CI Gate

# A single, always-running required status check (`ci-pass`) for branch protection.
#
# Problem it solves: backend-ci / frontend-ci are PATH-FILTERED, so a backend-only
# PR never triggers frontend-ci. If you marked those jobs as required checks
# directly, such a PR would hang forever on "Expected — waiting for status".
#
# This gate ALWAYS runs on every PR, figures out which CI workflows actually
# apply (same path filters), waits for them to finish, and passes iff they
# succeeded — treating a workflow that legitimately didn't run as a pass. So you
# require only `ci-pass` and single-area PRs never deadlock.
on:
  pull_request:
    branches: [main, development]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-pass:
    name: ci-pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same path filters as backend-ci.yml / frontend-ci.yml so this gate's
      # decision about "which workflow should run" matches reality.
      - name: Detect changed areas
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'src/backend/**'
              - '.github/workflows/backend-ci.yml'
            frontend:
              - 'src/frontend/**'
              - '.github/workflows/frontend-ci.yml'

      - name: Wait for applicable CI workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          workflows=()
          [ "${{ steps.changes.outputs.backend }}"  = "true" ] && workflows+=("backend-ci.yml")
          [ "${{ steps.changes.outputs.frontend }}" = "true" ] && workflows+=("frontend-ci.yml")

          if [ ${#workflows[@]} -eq 0 ]; then
            echo "No backend/frontend changes — no CI to gate. ✅"
            exit 0
          fi

          fail=0
          for wf in "${workflows[@]}"; do
            echo "::group::Waiting for $wf @ ${HEAD_SHA:0:8}"
            conclusion="none"
            # Poll up to ~40 min (80 × 30s) for the run to complete.
            for i in $(seq 1 80); do
              read -r status conclusion < <(
                gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$HEAD_SHA&per_page=1" \
                  --jq '.workflow_runs[0] | "\(.status // "missing") \(.conclusion // "none")"' \
                  2>/dev/null || echo "missing none"
              )
              echo "attempt $i: status=$status conclusion=$conclusion"
              [ "$status" = "completed" ] && break
              sleep 30
            done
            echo "::endgroup::"

            if [ "$conclusion" = "success" ]; then
              echo "✅ $wf succeeded"
            else
              echo "❌ $wf did not succeed (conclusion=$conclusion)"
              fail=1
            fi
          done

          exit $fail
