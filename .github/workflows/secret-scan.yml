name: Secret Scan

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# DO-9 / FS-5 — scan for committed credentials (API keys, tokens, passwords).
# Complements GitHub's native secret scanning + push protection (real-time, on
# push) with a committable, reproducible CI job that gives DO-9/M5.5 evidence.
#
# TruffleHog OSS is used (free for organizations); the popular gitleaks-action
# requires a paid org licence, so it is intentionally avoided.
#
# --only-verified keeps noise low: a finding fails the check only when TruffleHog
# can confirm the credential is live against its provider. To make this advisory
# instead of a gate, drop the `--fail` flag / the `extra_args` verification.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    - cron: '17 4 * * 1'   # weekly Mon 04:17 UTC — full-history sweep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # On PRs, scope the scan to the diff so feedback is fast and only flags
  # secrets the PR itself introduces. The action auto-fails on verified findings.
  pr-diff:
    name: PR diff scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog (PR diff)
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  # Full-history sweep — only on the weekly schedule or a manual run, NOT on every
  # push/PR: the PR-diff job already scans new commits, and history doesn't change
  # between pushes, so re-sweeping all commits on every merge is wasted minutes.
  # Run the pinned binary directly (the action's diff auto-detect is unreliable
  # for full-history scans and errors when BASE == HEAD).
  full-history:
    name: Full git-history scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install TruffleHog
        run: curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin v3.95.5
      - name: Scan full git history
        run: trufflehog git file://. --only-verified --fail --no-update

  # Gitleaks complements TruffleHog: it is pattern-based (catches secrets even
  # when the provider can't be reached to verify them) and scans the full commit
  # history. Run the pinned OSS image directly — the gitleaks Action requires a
  # paid licence for organizations. Allowlist + rules live in .gitleaks.toml.
  gitleaks:
    name: Gitleaks (full history)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1

  # Filesystem scan of the source tree — vulnerable deps + IaC/Dockerfile
  # misconfig + secrets — reported to the Security tab as SARIF. Lives here (not
  # cd.yml) so it runs on PRs and surfaces source issues BEFORE merge. Report-only;
  # the per-image CVE scans in cd.yml remain the hard deploy gate.
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
