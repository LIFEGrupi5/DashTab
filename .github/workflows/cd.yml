name: CD

# Continuous Delivery: build + push the app images to GHCR, then (Phase 2) deploy
# to the project-05 namespace. CI (lint/test) lives in backend-ci.yml /
# frontend-ci.yml — this workflow owns build → push → deploy (DO-4 / DO-13).
#
# Philosophy: images are artifacts and are published freely on every merge; the
# *deploy* is the gated step (GitHub Environment + approval) — see the Phase 2 stub.
on:
  push:
    branches: [main, development]
    tags: ['v*']
  workflow_dispatch:        # allow manual runs from the Actions tab

jobs:
  # Both build jobs run on every push to main/development (no path filter) — with
  # the gha layer cache, the unchanged service rebuilds fast. Split per service
  # because each has its own Dockerfile/context and its own GHCR package.
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # lets GITHUB_TOKEN push to the org's GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in, no PAT needed

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lifegrupi5/dashtab-backend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: src/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lifegrupi5/dashtab-frontend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # NOTE: NEXT_PUBLIC_* are baked at build time. This image ships the
      # Dockerfile/source defaults; pass --build-arg here once the cluster's real
      # API/Keycloak URLs are known (requires matching ARGs in the Dockerfile).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          file: src/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Bake the project-05 API base into the bundle (NEXT_PUBLIC_* are
          # build-time). The app reads only this var; the KDS hub URL derives
          # from it. Change if the api.* hostname changes.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.project-05.gjirafa.dev/api/v1

  # ── Phase 2: DEPLOY (gated) ────────────────────────────────────────────────
  # Deploys the freshly-built app images to the project-05 namespace, pinned to
  # the immutable sha tag (NOT the mutable 'development' tag) so every deploy is
  # a real, traceable rollout that's trivial to roll back.
  #
  # GATE: this job targets the `project-05` GitHub Environment. Add a required
  # reviewer to that Environment (repo Settings → Environments → project-05) and
  # the run pauses for a one-click approval before anything touches the cluster.
  # The scoped kubeconfig lives there too as the KUBECONFIG_PROJECT05 secret.
  deploy:
    name: Deploy to project-05
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/development'   # only the integration branch deploys
    environment: project-05                       # ← approval gate + scoped secret
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          echo "${{ secrets.KUBECONFIG_PROJECT05 }}" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Resolve immutable image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Deploy backend
        run: |
          helm upgrade --install dashtab-backend devops/helm/backend \
            -n project-05 -f devops/helm/backend/values-project05.yaml \
            --set image.tag="$IMAGE_TAG" \
            --wait --timeout 5m

      - name: Deploy frontend
        run: |
          helm upgrade --install dashtab-frontend devops/helm/frontend \
            -n project-05 -f devops/helm/frontend/values-project05.yaml \
            --set image.tag="$IMAGE_TAG" \
            --wait --timeout 5m

      # Belt-and-suspenders: helm --wait already blocks on readiness, but an
      # explicit rollout status fails the run loudly if a new pod crashloops
      # (e.g. a bad migration) instead of silently leaving the old pod serving.
      - name: Verify rollout
        run: |
          kubectl -n project-05 rollout status deploy/dashtab-backend --timeout=120s
          kubectl -n project-05 rollout status deploy/dashtab-frontend --timeout=120s
