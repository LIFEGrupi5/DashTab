name: CD

# Continuous Delivery: build + push the app images to GHCR, then (Phase 2) deploy
# to the project-05 namespace. CI (lint/test) lives in backend-ci.yml /
# frontend-ci.yml — this workflow owns build → push → deploy (DO-4 / DO-13).
#
# Philosophy: images are artifacts and are published freely on every merge; the
# *deploy* is the gated step (GitHub Environment + approval) — see the Phase 2 stub.
on:
  push:
    branches: [main, development]
    tags: ['v*']
  workflow_dispatch:        # allow manual runs from the Actions tab

jobs:
  # Both build jobs run on every push to main/development (no path filter) — with
  # the gha layer cache, the unchanged service rebuilds fast. Split per service
  # because each has its own Dockerfile/context and its own GHCR package.
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # lets GITHUB_TOKEN push to the org's GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in, no PAT needed

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/lifegrupi5/dashtab-backend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: src/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (DO-9)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/lifegrupi5/dashtab-backend@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/lifegrupi5/dashtab-frontend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # NOTE: NEXT_PUBLIC_* are baked at build time. This image ships the
      # Dockerfile/source defaults; pass --build-arg here once the cluster's real
      # API/Keycloak URLs are known (requires matching ARGs in the Dockerfile).
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          file: src/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Bake the project-05 API base into the bundle (NEXT_PUBLIC_* are
          # build-time). The app reads only this var; the KDS hub URL derives
          # from it. Change if the api.* hostname changes.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.project-05.gjirafa.dev/api/v1

      - name: Scan image with Trivy (DO-9)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/lifegrupi5/dashtab-frontend@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          # Skip npm's own bundled packages — these are part of the base image's
          # system npm, not our application code. Our app runs as `node server.js`
          # and never invokes npm at runtime.
          skip-dirs: /usr/local/lib/node_modules/npm

  # AIOps alert-triage service (DO-12). Small Python webhook image.
  build-aiops:
    name: Build & Push AIOps Triage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/lifegrupi5/dashtab-aiops-triage
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: devops/aiops
          file: devops/aiops/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (DO-9)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/lifegrupi5/dashtab-aiops-triage@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # ── Phase 2: DEPLOY (gated) ────────────────────────────────────────────────
  # Deploys the freshly-built app images to the project-05 namespace, pinned to
  # the immutable sha tag (NOT the mutable 'development' tag) so every deploy is
  # a real, traceable rollout that's trivial to roll back.
  #
  # GATE: this job targets the `project-05` GitHub Environment. Add a required
  # reviewer to that Environment (repo Settings → Environments → project-05) and
  # the run pauses for a one-click approval before anything touches the cluster.
  # The scoped kubeconfig lives there too as the KUBECONFIG_PROJECT05 secret.
  deploy:
    name: Deploy to project-05
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-aiops]
    if: github.ref == 'refs/heads/development'   # only the integration branch deploys
    environment: project-05                       # ← approval gate + scoped secret
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Detect which observability charts changed in this push, so we only
      # redeploy them when their own files change (not on every app code push).
      - name: Detect changed charts
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            prometheus:
              - 'devops/helm/prometheus/**'
            grafana:
              - 'devops/helm/grafana/**'

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          echo "${{ secrets.KUBECONFIG_PROJECT05 }}" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Resolve immutable image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # ── Azure Key Vault secret fetch (DO-9) ───────────────────────────────────
      # Pulls all runtime secrets from the vault so nothing sensitive lives in
      # values.yaml or GitHub repo secrets. ::add-mask:: redacts each value from
      # the Actions log before it's written to $GITHUB_ENV.
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Fetch secrets from Azure Key Vault (DO-9)
        run: |
          VAULT=kv-dashtab-p05
          get() { az keyvault secret show --vault-name "$VAULT" -n "$1" --query value -o tsv; }

          echo "::add-mask::$(get backend-conn-default)"
          echo "BACKEND_CONN_DEFAULT=$(get backend-conn-default)"     >> "$GITHUB_ENV"
          echo "::add-mask::$(get backend-conn-redis)"
          echo "BACKEND_CONN_REDIS=$(get backend-conn-redis)"         >> "$GITHUB_ENV"
          echo "::add-mask::$(get backend-conn-rabbitmq)"
          echo "BACKEND_CONN_RABBITMQ=$(get backend-conn-rabbitmq)"   >> "$GITHUB_ENV"
          echo "::add-mask::$(get backend-storage-accesskey)"
          echo "BACKEND_STORAGE_ACCESSKEY=$(get backend-storage-accesskey)" >> "$GITHUB_ENV"
          echo "::add-mask::$(get backend-storage-secretkey)"
          echo "BACKEND_STORAGE_SECRETKEY=$(get backend-storage-secretkey)" >> "$GITHUB_ENV"

      - name: Deploy backend
        run: |
          helm upgrade --install dashtab-backend devops/helm/backend \
            -n project-05 -f devops/helm/backend/values-project05.yaml \
            --set image.tag="$IMAGE_TAG" \
            --set "secrets.ConnectionStrings__Default=$BACKEND_CONN_DEFAULT" \
            --set "secrets.ConnectionStrings__Redis=$BACKEND_CONN_REDIS" \
            --set "secrets.ConnectionStrings__RabbitMQ=$BACKEND_CONN_RABBITMQ" \
            --set "secrets.Storage__AccessKey=$BACKEND_STORAGE_ACCESSKEY" \
            --set "secrets.Storage__SecretKey=$BACKEND_STORAGE_SECRETKEY" \
            --wait --timeout 5m

      - name: Deploy frontend
        run: |
          helm upgrade --install dashtab-frontend devops/helm/frontend \
            -n project-05 -f devops/helm/frontend/values-project05.yaml \
            --set image.tag="$IMAGE_TAG" \
            --wait --timeout 5m

      # Belt-and-suspenders: helm --wait already blocks on readiness, but an
      # explicit rollout status fails the run loudly if a new pod crashloops
      # (e.g. a bad migration) instead of silently leaving the old pod serving.
      # AIOps triage service (DO-12). Secrets come from the project-05 GitHub
      # Environment (add GROQ_API_KEY + SLACK_WEBHOOK_URL there), never the repo.
      - name: Deploy aiops-triage
        run: |
          helm upgrade --install dashtab-aiops-triage devops/helm/aiops-triage \
            -n project-05 -f devops/helm/aiops-triage/values-project05.yaml \
            --set image.tag="$IMAGE_TAG" \
            --set secret.GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            --set secret.SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
            --wait --timeout 5m

      # ── Observability config (DO-5) ────────────────────────────────────────
      # These ship upstream images (no per-commit build); CD just keeps their
      # repo-managed config — alert rules, alertmanager routing, dashboards — in
      # sync. Path-filtered so they only redeploy when their own chart changes.
      # The explicit restart guarantees the running pod reloads the new config
      # (a ConfigMap change alone doesn't reload a running process).
      # NOTE: stateful infra (postgres, redis, rabbitmq, minio, elasticsearch,
      # keycloak) is intentionally NOT auto-deployed here — deploy it manually.
      - name: Deploy prometheus + alertmanager
        if: steps.changes.outputs.prometheus == 'true'
        run: |
          helm upgrade --install dashtab-prometheus devops/helm/prometheus \
            -n project-05 --reuse-values --wait --timeout 5m
          kubectl -n project-05 rollout restart deploy/dashtab-prometheus deploy/dashtab-alertmanager
          kubectl -n project-05 rollout status  deploy/dashtab-prometheus   --timeout=120s
          kubectl -n project-05 rollout status  deploy/dashtab-alertmanager --timeout=120s

      - name: Deploy grafana
        if: steps.changes.outputs.grafana == 'true'
        run: |
          helm upgrade --install dashtab-grafana devops/helm/grafana \
            -n project-05 --reuse-values --wait --timeout 5m
          kubectl -n project-05 rollout restart deploy/dashtab-grafana
          kubectl -n project-05 rollout status  deploy/dashtab-grafana --timeout=120s

      - name: Verify rollout
        run: |
          kubectl -n project-05 rollout status deploy/dashtab-backend --timeout=120s
          kubectl -n project-05 rollout status deploy/dashtab-frontend --timeout=120s
          kubectl -n project-05 rollout status deploy/dashtab-aiops-triage --timeout=120s
