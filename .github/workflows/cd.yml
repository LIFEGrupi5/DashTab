  #   name: Deploy to project-05
  #   runs-on: ubuntu-latest
  #   needs: [build-backend, build-frontend]
  #   if: github.ref == 'refs/heads/development'
  #   environment: project-05          # configure approval + KUBECONFIG in repo settings
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: azure/setup-helm@v4
  #     - name: Write kubeconfig
  #       run: echo "${{ secrets.KUBECONFIG_PROJECT05 }}" > "$RUNNER_TEMP/kc" && echo "KUBECONFIG=$RUNNER_TEMP/kc" >> "$GITHUB_ENV"
  #     - name: Deploy via Helm
  #       run: |
  #         helm upgrade --install dashtab-backend devops/helm/backend \
  #           -n project-05 -f devops/helm/values-project05.yaml \
  #           --set image.tag=sha-${GITHUB_SHA::7}
