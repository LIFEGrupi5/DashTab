name: AIOps CI

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, development]
    paths:
      - 'devops/aiops/**'
      - '.github/workflows/aiops-ci.yml'
  pull_request:
    branches: [main, development]
    paths:
      - 'devops/aiops/**'
      - '.github/workflows/aiops-ci.yml'

defaults:
  run:
    working-directory: devops/aiops

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: devops/aiops/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check app.py

  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: devops/aiops/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dashtab/aiops:ci .
