name: AIOps CI

on:
  push:
    branches: [main, development]
    paths:
      - 'devops/aiops/**'
      - '.github/workflows/aiops-ci.yml'
  pull_request:
    branches: [main, development]
    paths:
      - 'devops/aiops/**'
      - '.github/workflows/aiops-ci.yml'

defaults:
  run:
    working-directory: devops/aiops

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: devops/aiops/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check app.py

  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: devops/aiops/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

  docker-smoke:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t dashtab/aiops:ci .

      - name: Start container
        run: |
          docker run -d --name aiops \
            -p 8080:8080 \
            -e LLM_PROVIDER=gemini \
            -e GEMINI_API_KEY=dummy \
            -e SLACK_WEBHOOK_URL=http://localhost \
            dashtab/aiops:ci

      - name: Wait for container to be healthy
        run: |
          for i in $(seq 1 10); do
            if docker exec aiops wget -qO- http://localhost:8080/healthz; then
              echo "healthy"; exit 0
            fi
            sleep 1
          done
          docker logs aiops
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f aiops
