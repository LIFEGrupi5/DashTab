apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dashtab-elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: dashtab
spec:
  serviceName: dashtab-elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/part-of: dashtab
    spec:
      # Elasticsearch runs as uid/gid 1000; fsGroup makes Kubernetes chown the
      # mounted PVC so ES can write to /usr/share/elasticsearch/data.
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: discovery.type
              value: single-node          # dev mode → skips bootstrap checks (vm.max_map_count)
            - name: xpack.security.enabled
              value: "false"              # DEV ONLY — no auth/TLS
            - name: ES_JAVA_OPTS
              value: "-Xms{{ .Values.heap }} -Xmx{{ .Values.heap }}"
            - name: bootstrap.memory_lock
              value: "false"
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
