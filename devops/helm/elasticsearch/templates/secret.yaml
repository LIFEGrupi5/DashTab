{{- if .Values.security.enabled }}
{{- /*
  Shared Elastic Stack credentials, consumed by BOTH the elasticsearch chart
  (ELASTIC_PASSWORD) and the kibana chart (kibana_system + Kibana encryption keys).

  Generate-or-reuse: on first install we mint random secrets; on every upgrade we
  read the already-applied Secret back via `lookup` and keep the same values, so
  passwords/encryption keys never churn (a changed encryptionKey would invalidate
  every Kibana session and saved object). `resource-policy: keep` means `helm
  uninstall` leaves the creds in place.

  NOTE: `helm template`/`--dry-run` has no cluster to look up, so it renders fresh
  randoms each time — that's expected; only real installs persist values.
*/}}
{{- $name := .Values.security.credentialsSecret }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $elasticPw := "" }}
{{- $kibanaPw := "" }}
{{- $encKey := "" }}
{{- $soKey := "" }}
{{- if $existing }}
{{- $elasticPw = index $existing.data "elastic-password" | b64dec }}
{{- $kibanaPw  = index $existing.data "kibana-system-password" | b64dec }}
{{- $encKey    = index $existing.data "kibana-encryption-key" | b64dec }}
{{- $soKey     = index $existing.data "kibana-savedobjects-key" | b64dec }}
{{- else }}
{{- $elasticPw = .Values.security.elasticPassword | default (randAlphaNum 24) }}
{{- $kibanaPw  = .Values.security.kibanaSystemPassword | default (randAlphaNum 24) }}
{{- $encKey    = randAlphaNum 48 }}
{{- $soKey     = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: dashtab
  annotations:
    # Survive `helm uninstall` so credentials (and Kibana session keys) are stable.
    helm.sh/resource-policy: keep
type: Opaque
data:
  elastic-password: {{ $elasticPw | b64enc | quote }}
  kibana-system-password: {{ $kibanaPw | b64enc | quote }}
  kibana-encryption-key: {{ $encKey | b64enc | quote }}
  kibana-savedobjects-key: {{ $soKey | b64enc | quote }}
{{- end }}
