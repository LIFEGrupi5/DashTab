apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashtab-kibana
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: dashtab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
        app.kubernetes.io/part-of: dashtab
    spec:
      containers:
        - name: kibana
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ELASTICSEARCH_HOSTS
              value: {{ .Values.elasticsearchUrl | quote }}
            - name: SERVER_PUBLICBASEURL
              value: "https://{{ .Values.ingress.host }}"
          ports:
            - name: http
              containerPort: 5601
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 12
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
