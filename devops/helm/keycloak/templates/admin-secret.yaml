{{- if .Values.adminSecret.enabled }}
{{- /*
  Keycloak admin password, kept OUT of git. The Bitnami subchart consumes this via
  auth.existingSecret / auth.passwordSecretKey (see values.yaml).

  Generate-or-reuse: minted random on first install, read back via `lookup` on every
  upgrade so the stored value never changes. `resource-policy: keep` survives uninstall.
  (`helm template`/--dry-run has no cluster → renders a throwaway random; only real
  installs persist.)

  ⚠️ Keycloak only bootstraps the admin user on an EMPTY database. On an
  already-initialised instance this Secret does NOT rotate the live password — see the
  kcadm.sh step in DEVOPS_HANDOFF.md (§Keycloak admin).
*/}}
{{- $name := .Values.adminSecret.name }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $pw := "" }}
{{- if $existing }}
{{- $pw = index $existing.data "admin-password" | b64dec }}
{{- else }}
{{- $pw = .Values.adminSecret.password | default (randAlphaNum 24) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: dashtab
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-password: {{ $pw | b64enc | quote }}
{{- end }}
