# This wrapper chart adds ONE resource of its own: a ConfigMap holding the realm
# export, which the Bitnami subchart mounts and imports on startup (see values.yaml).
# .Files.Get reads files/ inside this chart dir. NOTE: this prod realm
# INTENTIONALLY differs from devops/keycloak/realm-export.json (the local/Compose
# realm): prod ships NO seed `users` (owners self-register through the app), while
# local keeps demo logins for dev convenience. Keep the clients / roles / IdP
# config in sync between the two; never copy the local file's `users` array here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashtab-keycloak-realm
  labels:
    app.kubernetes.io/part-of: dashtab
data:
  realm-export.json: |-
{{ .Files.Get "files/realm-export.json" | indent 4 }}
