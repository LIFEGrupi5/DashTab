apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    # In-cluster only (not referenced by the ingress) — Prometheus scrapes this.
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
