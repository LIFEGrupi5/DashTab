# Dedicated ServiceAccount with token automount disabled. The API never calls the
# Kubernetes API, so it shouldn't carry a mountable API credential in every pod
# (least privilege — DO-9). Pinning the SA also stops the pods from falling back
# to the namespace 'default' SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
automountServiceAccountToken: false
