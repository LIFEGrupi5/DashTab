apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.fullname" . }}-secret
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
# stringData lets us write plain values; K8s base64-encodes them at rest.
# DEV ONLY: these come from values.yaml. In staging/prod, source them from an
# external secret store (Sealed Secrets / External Secrets / Key Vault) — Lecture 7.
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
