global:
  resolve_timeout: 5m
  # Webhook URL is read from a mounted Secret file (not stored in this config).
  slack_api_url_file: /etc/alertmanager/secrets/slack_url

route:
  receiver: slack
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: slack
    slack_configs:
      - channel: "#alerts"
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
