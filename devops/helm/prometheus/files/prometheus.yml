global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

# Send firing alerts to Alertmanager (in-cluster service).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["dashtab-alertmanager:9093"]

scrape_configs:
  # Prometheus scraping itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Infra exporters — addresses confirmed from the live cluster services.
  - job_name: postgres
    static_configs:
      - targets: ["dashtab-postgresql-metrics:9187"]

  - job_name: redis
    static_configs:
      - targets: ["dashtab-redis-metrics:9121"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["dashtab-rabbitmq:9419"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["dashtab-keycloak-metrics:9000"]
