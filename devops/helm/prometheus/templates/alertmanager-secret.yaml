{{- if .Values.alertmanager.enabled }}
# Slack webhook URL, mounted into Alertmanager as a file (slack_api_url_file).
# Set via: --set alertmanager.slackWebhookUrl='https://hooks.slack.com/...'
apiVersion: v1
kind: Secret
metadata:
  name: dashtab-alertmanager-slack
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: dashtab
type: Opaque
stringData:
  slack_url: {{ .Values.alertmanager.slackWebhookUrl | quote }}
{{- end }}
