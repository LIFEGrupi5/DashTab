# ── AIOps triage service (DO-12) ──────────────────────────────────────────────
replicaCount: 1

image:
  repository: ghcr.io/lifegrupi5/dashtab-aiops-triage
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8080

# Non-secret config → ConfigMap (env).
config:
  LLM_PROVIDER: groq
  GROQ_MODEL: llama-3.3-70b-versatile

# Secrets → Secret (env). Provide at install time with --set or values-project05.
# NEVER commit real values here.
secret:
  GROQ_API_KEY: ""
  SLACK_WEBHOOK_URL: ""

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi

# ── Production hardening ──────────────────────────────────────────────────────
# Image pull secrets — needed once the GHCR images/repo are private. Create the
# secret in the namespace first (holds a PAT, so it is NOT templated here):
#   kubectl -n project-05 create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<gh-user> \
#     --docker-password=<PAT with read:packages>
imagePullSecrets: []          # e.g. [{ name: ghcr-pull }]

# PodDisruptionBudget — preserves capacity during voluntary disruptions.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# startupProbe — gives the service time to boot before liveness counts.
startupProbe:
  enabled: true
  failureThreshold: 30
  periodSeconds: 5

# readOnlyRootFilesystem — when true the root FS is read-only with an emptyDir at
# /tmp. Verify the service's writable paths before enabling.
readOnlyRootFilesystem: false

# NetworkPolicy — default-deny + allow-list. Namespaced; only ENFORCED on a CNI
# that supports it. Off by default. egressInternet is ON here because the triage
# service calls the LLM provider (Groq) and Slack over the public internet.
networkPolicy:
  enabled: false
  egressInternet: true
