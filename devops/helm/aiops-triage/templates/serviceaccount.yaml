# Dedicated ServiceAccount with token automount disabled — the triage service
# never calls the Kubernetes API, so no mountable API credential belongs in its
# pods (least privilege — DO-9).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: aiops-triage
    app.kubernetes.io/part-of: dashtab
automountServiceAccountToken: false
