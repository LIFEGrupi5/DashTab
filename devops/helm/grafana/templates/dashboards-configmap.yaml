# Two ConfigMaps that make Grafana auto-load the DashTab dashboard on startup:
#   1. the dashboard *provider* (tells Grafana to read JSON from a directory)
#   2. the dashboard *model* itself (the JSON, loaded from files/)
# Both are mounted into the Grafana pod by the Deployment, so the dashboard is
# present the moment the pod is ready — no manual import. (DO-5)
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashtab-grafana-dashboard-provider
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: dashtab
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: dashtab
        orgId: 1
        folder: DashTab
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashtab-grafana-dashboards
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: dashtab
data:
  dashtab-overview.json: |
{{ .Files.Get "files/dashtab-overview.json" | indent 4 }}
