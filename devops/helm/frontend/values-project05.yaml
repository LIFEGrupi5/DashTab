# Overlay for the project-05 cluster.
#   helm upgrade --install dashtab-frontend devops/helm/frontend \
#     -n project-05 -f devops/helm/frontend/values-project05.yaml
image:
  tag: development
  pullPolicy: Always

# GHCR is private; the dedicated SA doesn't inherit the namespace pull secret, so
# set it explicitly. The `ghcr-pull` secret already exists in project-05.
imagePullSecrets:
  - name: ghcr-pull

ingress:
  host: app.project-05.gjirafa.dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod   # confirmed on project-05 — cert-manager issues the LE cert
  tls:
    enabled: true
    secretName: app-project05-tls

# ⚠️ NEXT_PUBLIC_* bake at BUILD time (via the cd.yml build-arg), not runtime —
# this is the source of truth for what that build bakes in. The app reads only
# NEXT_PUBLIC_API_BASE_URL; the KDS hub URL derives from it; auth is via the backend.
config:
  NODE_ENV: production
  NEXT_PUBLIC_API_BASE_URL: "https://api.project-05.gjirafa.dev/api/v1"
