# Dedicated ServiceAccount with token automount disabled — the frontend never
# calls the Kubernetes API, so no mountable API credential belongs in its pods
# (least privilege — DO-9).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
automountServiceAccountToken: false
