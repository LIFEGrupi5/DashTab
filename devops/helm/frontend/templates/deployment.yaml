apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}

  # Same zero-downtime rolling strategy as the backend: stand up the new pod and
  # wait for it to be Ready before tearing down the old one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      {{- include "frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "frontend.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll pods when the ConfigMap content changes on `helm upgrade`.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      # Auth for pulling images from a private registry (e.g. GHCR once private).
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Dedicated SA with no mounted API token — the frontend never calls the K8s API.
      serviceAccountName: {{ include "frontend.fullname" . }}
      automountServiceAccountToken: false
      # Pod-level hardening — the image runs as the non-root `nextjs` user (UID
      # 1001); enforce it at the API server so a bad image can't fall back to root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Container-level hardening: no privilege escalation, drop all Linux caps.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "frontend.fullname" . }}-config
          # Next.js standalone server has no dedicated health route, so probe the
          # root path. Both probes hit "/"; readiness gates rolling-update traffic.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          {{- if .Values.startupProbe.enabled }}
          # Holds liveness back until the Next.js server has finished booting.
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.readOnlyRootFilesystem }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if .Values.readOnlyRootFilesystem }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
