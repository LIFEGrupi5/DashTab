# Values for the Bitnami RabbitMQ subchart.
# Verify options with:  helm show values oci://registry-1.docker.io/bitnamicharts/rabbitmq

# Bitnami moved versioned images to docker.io/bitnamilegacy/ (2025).
global:
  security:
    allowInsecureImages: true

rabbitmq:
  image:
    repository: bitnamilegacy/rabbitmq
  fullnameOverride: dashtab-rabbitmq

  auth:
    username: dashtab
    password: dashtab          # DEV ONLY — see Lecture 7

  persistence:
    enabled: true
    size: 1Gi

  # RabbitMQ has a built-in Prometheus plugin (rabbitmq_prometheus) on :9419.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
