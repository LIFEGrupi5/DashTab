# Values for the Bitnami MinIO subchart.
# Verify options with:  helm show values oci://registry-1.docker.io/bitnamicharts/minio
minio:
  fullnameOverride: dashtab-minio
  mode: standalone

  auth:
    rootUser: dashtab
    rootPassword: dashtabsecret   # DEV ONLY, must be >= 8 chars — see Lecture 7

  # Pre-create the bucket the backend expects on first boot.
  defaultBuckets: "dashtab"

  persistence:
    enabled: true
    size: 5Gi

  # MinIO exposes Prometheus metrics natively at /minio/v2/metrics/cluster.
  metrics:
    serviceMonitor:
      enabled: false
