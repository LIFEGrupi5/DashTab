apiVersion: v2
name: postgresql
description: DashTab PostgreSQL — thin wrapper over the Bitnami chart
type: application
version: 0.1.0
appVersion: "16"

# We don't template Postgres ourselves — we depend on Bitnami's chart and only
# supply our own values.yaml. Run `helm dependency update devops/helm/postgresql`
# to pull charts/postgresql-*.tgz before the first install.
dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: oci://registry-1.docker.io/bitnamicharts
