# Values for the icoretech PgBouncer subchart (nested under `pgbouncer:`).
# Pools connections to PostgreSQL so the .NET backend doesn't open a fresh
# TCP/auth handshake per request. Backend connects here (:6432); Keycloak stays
# wired direct to postgres.
# Verify options with:  helm show values oci://ghcr.io/icoretech/charts/pgbouncer
pgbouncer:
  # Fixed name so the backend can hardcode `dashtab-pgbouncer` as the host.
  fullnameOverride: dashtab-pgbouncer

  service:
    port: 6432               # match the backend's connection string

  config:
    adminUser: admin
    adminPassword: admin     # DEV ONLY — see Lecture 7

    # Route the app database to the postgres service. pgbouncer authenticates the
    # client, then connects upstream using the userlist credentials below.
    databases:
      dashtab:
        host: dashtab-postgresql
        port: 5432
        dbname: dashtab

    # Client credentials pgbouncer accepts (and reuses upstream). Matches the
    # postgresql chart's auth.
    userlist:
      dashtab: dashtab       # DEV ONLY

    pgbouncer:
      auth_type: scram-sha-256      # match Postgres 17's default auth
      pool_mode: transaction
      max_client_conn: 200
      default_pool_size: 25
      ignore_startup_parameters: extra_float_digits
