apiVersion: v2
name: pgbouncer
description: DashTab PgBouncer — connection pooler in front of PostgreSQL (Bitnami wrapper)
type: application
version: 0.1.0
appVersion: "1"

# Run `helm dependency update devops/helm/pgbouncer` before the first install.
# Install AFTER postgresql (it dials the postgres service on startup).
dependencies:
  - name: pgbouncer
    version: "2.x.x"
    repository: oci://registry-1.docker.io/bitnamicharts
