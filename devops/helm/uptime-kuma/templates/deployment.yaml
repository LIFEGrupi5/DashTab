apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashtab-uptime-kuma
  labels:
    app.kubernetes.io/name: uptime-kuma
    app.kubernetes.io/part-of: dashtab
spec:
  replicas: 1  # SQLite backend — never scale above 1
  # SQLite on a ReadWriteOnce volume: the default RollingUpdate would start the
  # new pod before the old one releases the PVC → Multi-Attach error (different
  # node) or two processes writing one DB file (same node). Recreate kills the
  # old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
        app.kubernetes.io/part-of: dashtab
    spec:
      # NOTE: louislam/uptime-kuma runs as root by design (no supported non-root
      # UID), so runAsNonRoot is intentionally not set — see .trivyignore (KSV-0012).
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uptime-kuma
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3001
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: dashtab-uptime-kuma
        {{- else }}
          emptyDir: {}
        {{- end }}
