image:
  repository: louislam/uptime-kuma
  tag: "1"
  pullPolicy: IfNotPresent

service:
  port: 3001

# PVC enabled — Kuma stores everything (monitors, status page, notifications)
# in SQLite at /app/data. Losing this volume means losing all configuration.
# storageClassName omitted → inherits the cluster default (longhorn),
# same pattern as elasticsearch and postgresql charts.
persistence:
  enabled: true
  size: 1Gi

ingress:
  enabled: true
  className: nginx
  host: uptime.project-05.gjirafa.dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: uptime-project05-tls

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
