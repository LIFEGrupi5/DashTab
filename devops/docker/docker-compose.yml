services:

  # ── Databases ───────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: [backend, full]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: [backend, full]
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Identity ────────────────────────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    profiles: [backend, full]
    # Local dev: import the realm as-is. The Google IdP entry inside it will have
    # the literal placeholders for client_id/secret — "Sign in with Google" won't
    # work, but local username/password login (owner@dashtab.dev etc.) does.
    # To re-enable Google: restore the entrypoint+command+sed wrapper below and
    # set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET in devops/docker/.env.
    command: ["start-dev", "--import-realm"]
    # entrypoint: ["/bin/bash", "-c"]
    # command:
    #   - 'mkdir -p /opt/keycloak/data/import && sed "s|GOOGLE_CLIENT_ID_PLACEHOLDER|$$GOOGLE_CLIENT_ID|g; s|GOOGLE_CLIENT_SECRET_PLACEHOLDER|$$GOOGLE_CLIENT_SECRET|g" /tmp/realm-template.json > /opt/keycloak/data/import/realm-export.json && /opt/keycloak/bin/kc.sh start-dev --import-realm'
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 8080
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HEALTH_ENABLED: "true"
      # GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./../keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # - ./../keycloak/realm-export.json:/tmp/realm-template.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Message Broker ──────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    profiles: [backend, full]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Object Storage (S3-compatible) ──────────────────────────────────────────

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: [backend, full]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Dev Mail Catcher ────────────────────────────────────────────────────────

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    profiles: [backend, full]
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  # ── Backend (.NET 10) ───────────────────────────────────────────────────────

  backend:
    build:
      context: ../../src/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: [backend, full]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      ConnectionStrings__RabbitMQ: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      Storage__Endpoint: "http://minio:9000"
      Storage__PublicBaseUrl: "http://localhost:9000"
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Smtp__Host: mailhog
      Smtp__Port: "1025"
      Keycloak__Authority: "http://keycloak:8080/realms/dashtab"
      Keycloak__ValidIssuer: "http://localhost:8080/realms/dashtab"
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Frontend (Next.js) ──────────────────────────────────────────────────────

  frontend:
    build:
      context: ../../src/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: [full]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost/auth
      NEXT_PUBLIC_KEYCLOAK_REALM: dashtab
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: dashtab-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # ── Reverse Proxy ───────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles: [full]
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - keycloak

  # ── Observability ───────────────────────────────────────────────────────────

  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    profiles: [observability, full]
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    profiles: [observability, full]
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./promtail/config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    profiles: [observability, full]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      loki:
        condition: service_healthy

  # ── Centralized Logging — ELK (Elasticsearch + Logstash + Kibana) ───────────
  # Heavy stack (~3GB RAM). On-demand only: `docker compose --profile elk up`.
  # Host prereq once per machine:  sudo sysctl -w vm.max_map_count=262144
  # Pipeline: containers → filebeat → logstash:5044 → elasticsearch → kibana:5601

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.15.3}
    restart: unless-stopped
    profiles: [elk]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"     # DEV ONLY — no auth/TLS
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION:-8.15.3}
    restart: unless-stopped
    profiles: [elk]
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports:
      - "${LOGSTASH_BEATS_PORT:-5044}:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-8.15.3}
    restart: unless-stopped
    profiles: [elk]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELK_VERSION:-8.15.3}
    restart: unless-stopped
    profiles: [elk]
    user: root
    command: ["--strict.perms=false"]
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  loki_data:
  grafana_data:
  elasticsearch_data:
