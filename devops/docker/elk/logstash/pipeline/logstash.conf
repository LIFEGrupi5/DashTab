# Logstash pipeline — the "L" in ELK.
# Receives from Filebeat (:5044), lightly normalizes, writes to Elasticsearch.

input {
  beats {
    port => 5044
  }
}

filter {
  # Container metadata from Filebeat lands under [container]; lift the service
  # name to a top-level field so Kibana filters read nicely.
  if [container][name] {
    mutate { add_field => { "service" => "%{[container][name]}" } }
  }
  # Serilog emits "@l" / "level" for severity — normalize to log_level.
  if [level] {
    mutate { add_field => { "log_level" => "%{level}" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # One index per day: dashtab-logs-2026.05.28 — easy to rotate/delete later.
    index => "dashtab-logs-%{+YYYY.MM.dd}"
  }
}
